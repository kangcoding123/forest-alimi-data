name: 자동 수정 검사 후 반영

# 자동 수정(Claude 루틴)은 claude/ 로 시작하는 가지에만 올린다.
# 여기서 일정표를 검사해 통과한 것만 main에 합치고, 결과를 이슈에 남긴다.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  issues: write

concurrency: schedule-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 바뀐 파일 확인
        run: |
          git fetch origin main
          files=$(git diff --name-only origin/main...HEAD)
          echo "$files"
          bad=$(echo "$files" | grep -Ev '^(forests\.json|pending/[0-9]+\.md|held/[0-9]+\.md|results/[0-9]+\.md)$' || true)
          if [ -n "$bad" ]; then
            echo "자동 수정이 건드릴 수 없는 파일이 바뀌었습니다:" > fail.md
            echo "$bad" | sed 's/^/- /' >> fail.md
            exit 1
          fi

      - name: 일정표 검사
        run: |
          git show origin/main:forests.json > "$RUNNER_TEMP/base.json"
          if ! node validate.mjs "$RUNNER_TEMP/base.json" > validate.log 2>&1; then
            { echo "일정표 검사를 통과하지 못해 반영하지 않았습니다."; echo; echo '```'; cat validate.log; echo '```'; } > fail.md
            cat validate.log
            exit 1
          fi
          cat validate.log

      - name: main에 합치기
        run: |
          git config user.name "schedule-apply"
          git config user.email "schedule-apply@users.noreply.github.com"
          before=$(git rev-parse origin/main)
          git checkout -B main origin/main
          git merge --no-edit "origin/$BRANCH"
          git push origin main
          echo "BEFORE=$before" >> "$GITHUB_ENV"

      # 결과 메일은 제목만 봐도 알 수 있게 이슈 제목을 먼저 바꾼다.
      # (Gmail은 제목이 달라지면 새 대화로 보여 주므로, '발견' 메일에 묻히지 않는다.)
      # 이슈를 닫으면 GitHub가 영어 자동 메일("Closed #N")을 보내는데, 제목을 바꾸기 전에 닫아
      # 그 메일이 '발견' 대화에 붙고, 결과 대화에는 한글 결과 한 통만 남게 한다.
      - name: 결과를 이슈에 남기기
        run: |
          for file in $(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- results/); do
            number=$(basename "$file" .md)
            base=$(gh issue view "$number" --json title -q .title | sed -E 's/^\[[^]]*\] //; s/ — .*$//')
            if head -1 "$file" | grep -q '반영'; then
              gh issue close "$number"
              gh issue edit "$number" --title "[완료] $base — 하실 일 없음"
              { echo "## 처리를 마쳤습니다. 하실 일이 없습니다."; echo; echo "일정표를 고친 경우, 사용자 앱에는 다음에 앱을 열 때 적용됩니다."; echo; tail -n +2 "$file"; } > comment.md
              gh issue comment "$number" --body-file comment.md
            else
              gh issue edit "$number" --title "[보류] $base — 확인 필요" --add-label needs-review
              { echo "## 보류했습니다. 확인이 필요합니다."; echo; echo "자동으로 고치기에는 애매해서 앱의 일정표는 그대로 뒀습니다."; echo; echo "**하실 일:** Claude에게 \"이슈 ${number}번 봐줘\"라고 말씀해 주세요."; echo; tail -n +2 "$file"; } > comment.md
              gh issue comment "$number" --body-file comment.md
            fi
          done

      - name: 가지 지우기
        if: always()
        run: git push origin --delete "$BRANCH" || true

      - name: 실패 알림
        if: failure()
        run: |
          [ -f fail.md ] || echo "자동 수정을 반영하는 중 오류가 났습니다. Actions 기록을 확인하세요." > fail.md
          { echo; echo "Claude에게 이 이슈 번호를 알려 주세요."; echo; echo "받는 사람: @$OWNER"; } >> fail.md
          gh issue create --title "[확인 필요] 자동 수정을 반영하지 못함 ($(TZ=Asia/Seoul date +%F))" --body-file fail.md --label check-failed
