name: 숲나들e 예약 일정 확인

on:
  schedule:
    # 매일 08:00 (한국 시간). 1분 남짓 걸리고 공개 저장소라 비용이 없다.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: schedule-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 숲나들e 확인
        id: check
        run: node check.mjs
        continue-on-error: true

      # 바뀐 곳이 있으면 이슈를 만들고, 자동 수정이 읽을 수 있게 같은 내용을 pending/<이슈 번호>.md로 남긴다.
      - name: 변경 알림
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 저장소 주인에게 배정해야 '지켜보기'를 켜지 않아도 메일이 간다.
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "숲나들e 안내문에서 바뀐 곳을 발견했습니다. **아직 앱의 일정표는 고치지 않았습니다.**"
            echo
            echo "자동 수정이 내용을 살펴본 뒤(매일 오전 10시) 결과를 따로 메일로 보냅니다. 제목이 **[완료]** 이면 하실 일이 없고, **[보류]** 이면 확인이 필요합니다. 그 메일이 올 때까지는 아무것도 하지 않으셔도 됩니다."
            echo
            echo "---"
            echo
            cat report.md
          } > issue.md
          url=$(gh issue create --assignee "$OWNER" --title "[발견] 숲나들e 안내문 변경 ($(TZ=Asia/Seoul date +%F)) — 처리 대기 중" --body-file issue.md --label schedule-change)
          number=${url##*/}
          mkdir -p pending
          cp report.md "pending/$number.md"

      # 실제 예약 달력과 일정표의 예측을 대조한다. 안내문은 그대로인데 운영만 바뀐 경우를 잡는다.
      - name: 예약 달력 대조
        id: calendar
        run: node calendar.mjs
        continue-on-error: true

      # 믿기 어려운 실행에서는 프로그램이 파일을 고치지 않으므로, 바뀐 것만 올리면 된다.
      - name: 기준 자료 저장
        run: |
          git config user.name "schedule-check"
          git config user.email "schedule-check@users.noreply.github.com"
          for f in snapshot.json calendar.json pending; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "일정 확인 $(TZ=Asia/Seoul date +%F)"
          git pull -q --rebase
          git push

      # 달력 어긋남은 자동 수정 대상이 아니다(pending 파일을 만들지 않는다). 사람이 원인을 확인한다.
      - name: 달력 어긋남 알림
        if: steps.calendar.outputs.calendar_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "실제 예약 달력과 앱의 일정이 다른 휴양림이 있습니다. 이 경우는 자동으로 고치지 않습니다."
            echo
            echo "**하실 일:** Claude에게 이 이슈 번호를 알려 주세요. (예: \"이슈 12번 봐줘\")"
            echo
            echo "---"
            echo
            cat calendar-report.md
          } > issue.md
          gh issue create --assignee "$OWNER" --title "[확인 필요] 예약 달력과 앱 일정이 다름 ($(TZ=Asia/Seoul date +%F))" --body-file issue.md --label calendar-mismatch

      - name: 달력 확인 실패 알림
        if: steps.calendar.outputs.calendar_unreliable == 'true' || steps.calendar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -f calendar-report.md ] || echo "예약 달력 대조 프로그램이 결과를 남기지 못하고 끝났습니다. Actions 기록을 확인하세요." > calendar-report.md
          gh issue create --assignee "$OWNER" --title "[확인 필요] 예약 달력을 읽지 못함 ($(TZ=Asia/Seoul date +%F))" --body-file calendar-report.md --label check-failed

      - name: 확인 실패 알림
        if: steps.check.outputs.failed == 'true' || steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          # 저장소 주인에게 배정해야 '지켜보기'를 켜지 않아도 메일이 간다.
          OWNER: ${{ github.repository_owner }}
        run: gh issue create --assignee "$OWNER" --title "[확인 필요] 숲나들e 안내문을 읽지 못함 ($(TZ=Asia/Seoul date +%F))" --body-file report.md --label check-failed
